name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test DSP and APO
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/VolumeLift"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/Release/VolumeLift.exe, build/Release/VolumeLiftApo.dll, README.md, LICENSE $out
          Compress-Archive -Path "$out/*" -DestinationPath dist/VolumeLift-win-x64.zip -Force
          Get-FileHash dist/VolumeLift-win-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  VolumeLift-win-x64.zip" } | Set-Content dist/VolumeLift-win-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeLift-win-x64
          path: dist/VolumeLift-win-x64.zip*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/VolumeLift-win-x64.zip dist/VolumeLift-win-x64.zip.sha256 --title "VolumeLift ${{ github.ref_name }}" --generate-notes --prerelease
